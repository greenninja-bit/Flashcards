<!DOCTYPE html>
<head>
  <meta charset="UTF-8" lang="en">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <label class="dark">Dark Mode: <input type="checkbox" id="dark" checked onclick="document.body.classList.toggle('light')"></label>
  <div class="container">
    <div class="button-container">
      <select id="topic-name" class="select"></select>
      <select id="cards-name" class="select" size="1" multiple></select>
    </div>
    <div class="card-container" id="card-container">
      <p id="card-text" class="card-text"></p>
    </div>
    <div class="button-container">
      <button class="button" id="back-button"><</button>
      <p id="card-number">/</p>
      <button class="button" id="forward-button">></button>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
